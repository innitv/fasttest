<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Цвет строки статуса iOS. Здесь — только стартовая заглушка:
      `src/lib/page-canvas.ts` переписывает значение цветом ВЕРХНЕЙ кромки
      текущего экрана при каждой смене стадии, поэтому на экранах банка строка
      статуса синяя, а у подрядчика светлая. Нижняя системная зона (панель
      Safari) сюда не относится: её красит канва страницы своим, отдельно
      измеренным цветом нижней кромки — см. правило `html` в `src/styles.css`.
    -->
    <meta name="theme-color" content="#ffffff" />
    <!--
      ── Временный переключатель эксперимента: `?tc=off` ──────────────────

      Гипотеза, которую он проверяет. Двухцветная канва (`--page-canvas` /
      `--page-canvas-bottom`) на живом iPhone НЕ развела верх и низ: цвета
      системных зон остались прежними. Это ровно тот риск, который записан в
      `FIXES.md` (баг 5, «Оставшиеся ограничения»): если конкретная версия iOS
      тонирует панели значением `theme-color`, а не фоном страницы, то тег —
      один на документ — красит обе зоны цветом ВЕРХА, и канва до них не
      доходит вовсе. Тогда без тега Safari обязан упасть обратно на фон
      страницы, и двухцветная канва заработает сама.

      Развести это рассуждением нельзя: локально WebKit нет, а Chromium ведёт
      себя иначе. Поэтому режим переключается адресом и проверяется на
      устройстве:
        • без параметра или `?tc=on` — как сейчас, тег живёт и синхронизирован
          с верхней кромкой экрана (`src/lib/page-canvas.ts`);
        • `?tc=off` — узел тега УДАЛЯЕТСЯ из документа. Не пустое значение и не
          `transparent`: пустой или прозрачный `theme-color` — это тоже
          указание браузеру, а нам нужно его отсутствие.

      Почему инлайн-скрипт в `<head>`, а не код приложения. Классический
      инлайн-скрипт выполняется синхронно во время разбора `<head>`, сразу
      после того как узел тега разобран, — до первой отрисовки и до того, как
      Safari успеет применить значение. Модуль `main.tsx` отложен (`type=
      "module"`), он выполнился бы уже после разбора документа, и тег успел бы
      сработать: эксперимент проверял бы не то, что задуман.

      Второго источника правды не заводится: приложение НЕ парсит `tc`
      само, а смотрит на наличие узла (`page-canvas.ts` пишет значение только
      в существующий тег и никогда не создаёт его заново). Атрибут
      `data-theme-color="off"` на `<html>` — для приёмки, чтобы отличить
      «режим выключен» от «тег пропал по другой причине».
    -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(location.search).get("tc") !== "off") return;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.remove();
          document.documentElement.dataset.themeColor = "off";
        } catch (error) {
          /* Режим — диагностический: его сбой не должен ронять демо. */
        }
      })();
    </script>
    <title>Демо оплаты для подрядчиков</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

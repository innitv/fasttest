<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Цвет системных зон устройства (строка статуса iOS сверху, полоса за
      панелью Safari снизу) — БЕЛЫЙ, один на весь документ и на все экраны.

      Почему статический, а не подобранный под экран. Тег `theme-color` один на
      документ, и проверка на живом iPhone показала, что тонирует панели именно
      он, а не фон страницы: пока тег есть, никакой фон до зон не доходит, а
      когда его нет (это и проверял временный режим `?tc=off`) — цвета зон не
      меняются вовсе. Значит развести верх и низ на этом движке нечем, и
      единственная оставшаяся ось — какой цвет получают обе зоны сразу.
      Решение пользователя 2026-07-25: белый. Цена принята осознанно — на синих
      экранах банка над контентом видна белая полоса; взамен зоны перестают
      мигать при переходах между экранами.

      Единственный источник правды — это значение: код его больше не
      переписывает, динамической синхронизации со стадией нет.
    -->
    <meta name="theme-color" content="#ffffff" />
    <title>Демо оплаты для подрядчиков</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
